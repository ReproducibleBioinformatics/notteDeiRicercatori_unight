<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Moderazione — La mappa delle persone</title>
    <link rel="stylesheet" href="/assets/style.css?v=5" />
    <style>
      .mod { max-width: 620px; margin: 0 auto; padding: 22px 18px 40px; }
      .mod h1 {
        font-family: var(--display); font-weight: 800; font-size: 28px;
        letter-spacing: -0.02em; margin: 0 0 4px;
      }
      .mod .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
      .row {
        display: flex; align-items: center; gap: 11px;
        padding: 11px 13px; border-radius: 11px; background: var(--surface);
        border: 1px solid var(--hairline); margin-bottom: 7px;
      }
      .row .dot { width: 11px; height: 11px; border-radius: 50%; flex: none; }
      .row .nome { font-size: 17px; flex: 1; word-break: break-word; }
      .row .meta { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
      .row button {
        appearance: none; border: 1px solid rgba(255, 140, 120, 0.45);
        background: rgba(255, 107, 74, 0.14); color: #ffb3a0;
        font: inherit; font-size: 14px; padding: 7px 13px; border-radius: 999px; cursor: pointer;
      }
      .row.gone { opacity: 0.35; }
      .toolbar { display: flex; gap: 9px; margin-bottom: 18px; }
      .toolbar input {
        flex: 1; font: inherit; font-size: 16px; color: var(--ink);
        background: var(--surface); border: 1px solid var(--hairline);
        border-radius: 11px; padding: 12px 14px;
      }
      .danger {
        margin-top: 26px; padding-top: 18px; border-top: 1px solid var(--hairline);
      }
      .danger button {
        appearance: none; background: none; color: #ffb3a0; font: inherit; font-size: 14px;
        border: 1px solid rgba(255, 140, 120, 0.45); border-radius: 999px;
        padding: 9px 16px; cursor: pointer;
      }
      .empty { color: var(--muted); font-size: 15px; padding: 20px 0; }
    </style>
  </head>
  <body>
    <main class="mod" id="app"></main>
    <script type="module" src="/assets/admin.js?v=5"></script>
  </body>
</html>
